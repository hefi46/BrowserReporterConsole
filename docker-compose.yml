services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: browser_reporter
      POSTGRES_PASSWORD: browser_reporter
      POSTGRES_DB: browser_reporter
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: '
      -c log_timezone=UTC

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-changeme-session-secret}
      DATABASE_URL: postgresql+asyncpg://browser_reporter:browser_reporter@db:5432/browser_reporter
      # LDAP / Active Directory (optional — leave LDAP_ENABLED unset to disable)
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-(&(objectClass=user)(sAMAccountName={username}))}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      LDAP_ADMIN_GROUP_DN: ${LDAP_ADMIN_GROUP_DN:-}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-user}
    ports:
      - "0.0.0.0:8000:8000"

volumes:
  db_data: 