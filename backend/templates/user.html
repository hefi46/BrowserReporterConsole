{% extends "base.html" %}

{% block title %}User Details - Browser Reporter{% endblock %}

{% block head %}
<style>
    .url-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-cell a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="fas fa-user-circle me-2"></i>{{ heading }}</h4>
    <div>
        <select id="daysFilter" class="form-select form-select-sm d-inline-block w-auto">
            <option value="">All Time</option>
            <option value="1">Last 24 Hours</option>
            <option value="7">Last 7 Days</option>
            <option value="30">Last 30 Days</option>
            <option value="90">Last 3 Months</option>
        </select>
        <select id="pageSize" class="form-select form-select-sm d-inline-block w-auto ms-2">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
        </select>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Timestamp</th>
                        <th>Title</th>
                        <th>URL</th>
                        <th>Computer</th>
                    </tr>
                </thead>
                <tbody id="visitsTable"></tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <div><small>Showing <span id="showingStart">0</span>-<span id="showingEnd">0</span> of <span id="totalCount">0</span></small></div>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" id="prevBtn">Prev</button>
                <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const username = {{ username | tojson }};
    let page = 1, pageSize = 50, total = 0;

    document.getElementById('pageSize').addEventListener('change', () => { pageSize = parseInt(document.getElementById('pageSize').value); page = 1; load(); });
    document.getElementById('daysFilter').addEventListener('change', () => { page = 1; load(); });
    document.getElementById('prevBtn').addEventListener('click', () => { if (page > 1) { page--; load(); } });
    document.getElementById('nextBtn').addEventListener('click', () => { if (page < Math.ceil(total / pageSize)) { page++; load(); } });

    async function load() {
        const days = document.getElementById('daysFilter').value;
        const qs = new URLSearchParams({ page: String(page), page_size: String(pageSize) });
        if (days) qs.set('days', days);

        const resp = await fetch(`/api/reports/user/${encodeURIComponent(username)}?${qs.toString()}`);
        if (!resp.ok) { showError('Failed to load visit history'); return; }
        const data = await resp.json();
        total = data.pagination.total_count;
        document.getElementById('showingStart').textContent = ((data.pagination.page - 1) * data.pagination.page_size) + 1;
        document.getElementById('showingEnd').textContent = Math.min(data.pagination.page * data.pagination.page_size, total);
        document.getElementById('totalCount').textContent = total;
        document.getElementById('prevBtn').disabled = !data.pagination.has_prev;
        document.getElementById('nextBtn').disabled = !data.pagination.has_next;

        // Check if any visits have source or profile data — only show columns if needed
        const hasSource = data.data.some(v => v.source);
        const hasProfile = data.data.some(v => v.browserProfile && v.browserProfile !== 'Default');

        // Update table headers dynamically
        const thead = document.querySelector('#visitsTable').closest('table').querySelector('thead tr');
        thead.innerHTML = `<th>Timestamp</th><th>Title</th><th>URL</th><th>Computer</th>`
            + (hasSource ? '<th>Source</th>' : '')
            + (hasProfile ? '<th>Profile</th>' : '');

        document.getElementById('visitsTable').innerHTML = data.data.map(v => {
            const ts = new Date(v.timestamp);
            const tstr = `${ts.toLocaleDateString()} ${ts.toLocaleTimeString()}`;
            const safeUrl = escapeHtml(v.url);
            const sourceBadge = v.source ? (v.source.includes('edge') ? 'bg-info' : v.source.includes('windows') ? 'bg-primary' : 'bg-success') : 'bg-secondary';
            const sourceLabel = v.source ? v.source.replace('windows_agent_edge', 'Edge').replace('windows_agent', 'Chrome').replace('chrome_extension', 'Extension') : '';
            const isWindows = v.source && v.source.startsWith('windows_');
            const winIcon = isWindows ? '<i class="fab fa-windows me-1"></i>' : '';
            return `<tr>
                <td>${tstr}</td>
                <td>${escapeHtml(v.title || '')}</td>
                <td class="url-cell"><a href="${safeUrl}" target="_blank" rel="noopener" title="${safeUrl}">${safeUrl}</a></td>
                <td>${winIcon}<span class="badge bg-secondary">${escapeHtml(v.computerName)}</span></td>`
                + (hasSource ? `<td><span class="badge ${sourceBadge}">${sourceLabel}</span></td>` : '')
                + (hasProfile ? `<td>${escapeHtml(v.browserProfile || '')}</td>` : '')
                + `</tr>`;
        }).join('');
    }

    window.addEventListener('load', async () => { await checkUserRole(); load(); });
</script>
{% endblock %}
