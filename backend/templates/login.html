{% extends "base.html" %}

{% block title %}Login - Browser Guardian{% endblock %}

{% block navbar %}{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width: 360px;">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4"><i class="fas fa-lock me-2"></i>Browser Guardian</h4>
            {% if error %}
            <div class="alert alert-danger py-2"><small>{{ error }}</small></div>
            {% endif %}
            <form method="post" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" required class="form-control" autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" required class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            {% if ldap_enabled %}
            <div class="text-center mt-3">
                <small class="text-muted"><i class="fas fa-building me-1"></i>Domain authentication enabled</small>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
