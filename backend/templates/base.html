<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Browser Reporter{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); border-radius: .5rem; }
        .table thead th { border-bottom: 2px solid #eee; }
        .page-header { background: linear-gradient(135deg, #2c3e6b, #3b5998); color: #fff; }
        .section-card .card-header { background: #f8f9fb; border-bottom: 2px solid #e2e6ed; color: #2c3e6b; font-weight: 600; }
        .section-card .card-header i { color: #5b7fc7; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2">
                <a class="btn {% block nav_user_search_class %}btn-outline-light{% endblock %} btn-sm" href="/"><i class="fas fa-users me-1"></i>User Search</a>
                <a class="btn {% block nav_keyword_search_class %}btn-outline-light{% endblock %} btn-sm" href="/keyword-search"><i class="fas fa-search me-1"></i>Keyword Search</a>
            </div>
            <div class="navbar-nav ms-auto d-flex align-items-center">
                {% if is_admin(request) %}
                <a class="nav-link" href="/admin">Admin</a>
                <a class="nav-link" href="/client-config">Client Config</a>
                {% endif %}
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>
    {% endblock %}

    {% block body %}
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
