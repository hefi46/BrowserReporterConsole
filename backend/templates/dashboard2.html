<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Search</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<style>
		body { background: #f7f7f9; }
		.card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
		.table thead th { border-bottom: 2px solid #eee; }
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container d-flex justify-content-between align-items-center">
			<div class="d-flex gap-2">
				<a class="btn btn-light btn-sm text-dark" href="/"><i class="fas fa-users me-1"></i>User Search</a>
				<a class="btn btn-outline-light btn-sm" href="/keyword-search"><i class="fas fa-search me-1"></i>Keyword Search</a>
			</div>
			<div class="navbar-nav ms-auto d-flex align-items-center">
				<a class="nav-link" href="/admin" id="adminLink" style="display: none;">Admin</a>
				<a class="nav-link" href="/client-config" id="clientConfigLink" style="display: none;">Client Config</a>
				<a class="nav-link" href="/logout">Logout</a>
			</div>
		</div>
	</nav>

	<div class="container py-4">
		<div class="row g-3 align-items-end mb-3">
			<div class="col-md-3">
				<label class="form-label">Homegroup</label>
				<select id="hg" class="form-select"></select>
			</div>
			<div class="col-md-3">
				<label class="form-label">Activity (days)</label>
				<select id="days" class="form-select">
					<option value="">All</option>
					<option value="1">1</option>
					<option value="7">7</option>
					<option value="30">30</option>
					<option value="90">90</option>
				</select>
			</div>
			<div class="col-md-4">
				<label class="form-label">Search</label>
				<input id="q" class="form-control" placeholder="name, email, username, homegroup" />
			</div>
			<div class="col-md-2">
				<label class="form-label">Per page</label>
				<select id="pp" class="form-select">
					<option value="25">25</option>
					<option value="50" selected>50</option>
					<option value="100">100</option>
				</select>
			</div>
		</div>

		<div class="d-flex gap-2 mb-3">
			<button class="btn btn-primary" id="apply"><i class="fas fa-search me-1"></i>Search</button>
			<button class="btn btn-outline-secondary" id="clear"><i class="fas fa-undo me-1"></i>Reset</button>
		</div>

		<!-- Empty state message -->
		<div class="card" id="emptyState">
			<div class="card-body text-center py-5">
				<i class="fas fa-search fa-3x text-muted mb-3"></i>
				<h5 class="text-muted">Search to begin</h5>
				<p class="text-muted small">Enter search criteria above and click Search or press Enter</p>
			</div>
		</div>

		<!-- Results table (hidden initially) -->
		<div class="card" id="resultsCard" style="display: none;">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-hover align-middle" id="tbl">
						<thead class="table-light">
							<tr>
								<th>User</th>
								<th>Homegroup</th>
								<th>Total Visits</th>
								<th>Unique URLs</th>
								<th>Last Activity</th>
								<th></th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
				<div class="d-flex justify-content-between align-items-center">
					<small class="text-muted">Showing <span id="s">0</span>-<span id="e">0</span> of <span id="t">0</span></small>
					<div class="btn-group btn-group-sm">
						<button class="btn btn-outline-secondary" id="prev">Prev</button>
						<button class="btn btn-outline-secondary" id="next">Next</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		let page = 1, pageSize = 50, total = 0;
		function escapeHtml(str) { if (str == null) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
		async function checkUserRole() {
			try {
				const r = await fetch('/api/auth/user');
				if (r.ok) {
					const user = await r.json();
					if (user.role === 'admin') {
						document.getElementById('adminLink').style.display = '';
						document.getElementById('clientConfigLink').style.display = '';
					}
				}
			} catch (e) {
				console.error('Failed to check user role:', e);
			}
		}
		async function loadHGs() {
			const r = await fetch('/api/meta/homegroups');
			const j = r.ok ? await r.json() : { homegroups: [] };
			const hg = document.getElementById('hg');
			hg.innerHTML = '<option value="">All</option>' + (j.homegroups||[]).map(h => `<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`).join('');
		}
		async function load() {
			// Show results, hide empty state
			document.getElementById('emptyState').style.display = 'none';
			document.getElementById('resultsCard').style.display = 'block';

			const params = new URLSearchParams({ page: String(page), page_size: String(pageSize) });
			const hg = document.getElementById('hg').value;
			const days = document.getElementById('days').value;
			const q = document.getElementById('q').value.trim();
			if (hg) params.set('homegroup', hg);
			if (days) params.set('days', days);
			if (q) params.set('search', q);
			const r = await fetch(`/api/reports/all?${params.toString()}`);
			if (!r.ok) return;
			const j = await r.json();
			total = j.pagination.total_count;
			page = j.pagination.page;
			pageSize = j.pagination.page_size;
			document.getElementById('t').textContent = total;
			document.getElementById('s').textContent = ((page-1)*pageSize)+1;
			document.getElementById('e').textContent = Math.min(page*pageSize, total);
			document.getElementById('prev').disabled = !j.pagination.has_prev;
			document.getElementById('next').disabled = !j.pagination.has_next;
			const tbody = document.querySelector('#tbl tbody');
			tbody.innerHTML = j.data.map(u => `
				<tr>
					<td>
						<div class="fw-bold">${escapeHtml(u.displayName || u.username)}</div>
						<small class="text-muted">${escapeHtml(u.email || '')}</small>
					</td>
					<td>${escapeHtml(u.department || '')}</td>
					<td><span class="badge bg-primary">${u.totalVisits||0}</span></td>
					<td><span class="badge bg-info">${u.uniqueUrls||0}</span></td>
					<td><small class="text-muted">${u.lastActivity ? new Date(u.lastActivity).toLocaleDateString() : 'Never'}</small></td>
					<td><a class="btn btn-sm btn-outline-primary" href="/user/${encodeURIComponent(u.username)}"><i class="fas fa-eye"></i></a></td>
				</tr>
			`).join('');
		}
		document.getElementById('apply').addEventListener('click', () => { page = 1; pageSize = parseInt(document.getElementById('pp').value); load(); });
		document.getElementById('clear').addEventListener('click', () => { document.getElementById('hg').value=''; document.getElementById('days').value=''; document.getElementById('q').value=''; page=1; total=0; document.querySelector('#tbl tbody').innerHTML=''; document.getElementById('t').textContent='0'; document.getElementById('s').textContent='0'; document.getElementById('e').textContent='0'; document.getElementById('prev').disabled=true; document.getElementById('next').disabled=true; document.getElementById('resultsCard').style.display='none'; document.getElementById('emptyState').style.display='block'; });
		document.getElementById('prev').addEventListener('click', () => { if (page>1) { page--; load(); } });
		document.getElementById('next').addEventListener('click', () => { const max = Math.ceil(total/pageSize); if (page<max) { page++; load(); } });
		document.getElementById('pp').addEventListener('change', () => { page = 1; pageSize = parseInt(document.getElementById('pp').value); load(); });
		document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); page = 1; pageSize = parseInt(document.getElementById('pp').value); load(); } });
		window.addEventListener('load', async () => { await checkUserRole(); await loadHGs(); });
	</script>
</body>
</html>
